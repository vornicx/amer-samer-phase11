name: Apply design hardening

on:
  push:
    branches:
      - fix/design-hardening-20260814
    paths:
      - .github/workflows/apply-design-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-stylesheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/design-hardening-20260814
      - name: Add hardening stylesheet link
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          source = path.read_text(encoding='utf-8')
          link = '  <link rel="stylesheet" href="./design-hardening.css" />\n'
          if 'design-hardening.css' not in source:
              source = source.replace('</head>', link + '</head>', 1)
              path.write_text(source, encoding='utf-8')
          PY
      - name: Commit generated wiring
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name "archic-design-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix(ui): load Samer design hardening layer"
          git push origin HEAD:fix/design-hardening-20260814
